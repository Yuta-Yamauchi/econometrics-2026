<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="計量経済学I 第8回。図や式を書き足しながら学ぶ統計的推論とモデルの活用。">
  <meta name="theme-color" content="#08658a">
  <title>第8回 統計的推論とモデルの活用</title>
  <link rel="stylesheet" href="assets/board.css">
  <script defer src="assets/figures.js"></script>
  <script defer src="assets/lecture.js"></script>
  <script defer src="assets/board.js"></script>
</head>
<body>
  <a class="skip" href="#board">板書へ移動</a>
  <header class="masthead">
    <div class="identity">計量経済学 I <span>第8回</span></div>
    <div class="utilities"><button id="toc-open" type="button">目次</button><button id="notes-open" type="button" aria-expanded="false" aria-controls="notes">講義ノート</button><button id="sources-open" type="button">出典・設定</button><button id="fullscreen" type="button">全画面</button></div>
  </header>
  <main>
    <article id="board" class="board" tabindex="-1" aria-labelledby="scene-title">
      <header class="board-heading"><div id="chapter" class="chapter"></div><h1 id="scene-title"></h1><p id="question" class="question"></p></header>
      <div id="workspace" class="workspace"><div id="drawing" class="drawing"></div><div id="writing" class="writing"></div></div>
      <div class="explanation"><span id="cue" class="cue"></span><p id="caption" aria-live="polite" aria-atomic="true"></p></div>
      <div id="source" class="source"></div>
    </article>
    <aside id="notes" class="notes" hidden><h2>この場面の講義ノート</h2><div id="notes-body"></div></aside>
  </main>
  <footer class="controls">
    <div class="transport"><button id="prev" type="button">前へ</button><button id="next" class="primary" type="button">次へ</button><button id="replay" type="button" title="現在の書き込みを再生">もう一度</button></div>
    <div class="position"><label for="scrubber" id="position-label"></label><input id="scrubber" type="range" min="0" value="0" aria-label="講義の再生位置"></div>
    <div class="hint">Space / → で次へ <span>← で前へ</span></div>
  </footer>
  <dialog id="toc"><div class="dialog-head"><h2>第8回の目次</h2><button type="button" data-close>閉じる</button></div><nav id="toc-list" aria-label="講義の場面"></nav></dialog>
  <dialog id="sources"><div class="dialog-head"><h2>出典・設定</h2><button type="button" data-close>閉じる</button></div><div id="sources-body"></div></dialog>
  <noscript><p class="noscript">この講義の段階表示にはJavaScriptを使用します。ブラウザーでJavaScriptを有効にしてください。</p></noscript>
</body>
</html>
